<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简洁倒计时预览</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #eef2f6;
        color: #101828;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .slide {
        width: min(92vw, 1080px);
        aspect-ratio: 16 / 9;
        padding: 5%;
        background: #ffffff;
        box-shadow: 0 16px 44px rgba(16, 24, 40, 0.18);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <iframe src="./src/index.html" title="简洁倒计时"></iframe>
    </div>
  </body>
</html>
